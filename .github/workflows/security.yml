name: Security Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Bandit (SAST)
        run: bandit -r . || true
      - name: Run Flask app in background
        run: |
          python app.py &
          sleep 5
      - name: Run ZAP (DAST)
        run: |
          docker run -u zap -p 8080:8080 -d owasp/zap2docker-stable zap.sh -daemon -port 8080 -host 0.0.0.0
          sleep 15
          docker exec $(docker ps -q --filter ancestor=owasp/zap2docker-stable) zap-cli -p 8080 open-url http://localhost:5000/api/users || true
          docker exec $(docker ps -q --filter ancestor=owasp/zap2docker-stable) zap-cli -p 8080 spider http://localhost:5000 || true
          docker exec $(docker ps -q --filter ancestor=owasp/zap2docker-stable) zap-cli -p 8080 active-scan http://localhost:5000 || true
          docker exec $(docker ps -q --filter ancestor=owasp/zap2docker-stable) zap-cli -p 8080 report -o /zap/zap_report.html -f html || true
          docker cp $(docker ps -q --filter ancestor=owasp/zap2docker-stable):/zap/zap_report.html ./zap_report.html || echo "No report" > zap_report.html
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap_report.html
